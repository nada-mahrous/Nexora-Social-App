<!-- ================= COMMENTS ================= -->
<section>
  <div class="mt-3 border-t border-slate-200 pt-4 p-3">
    <!-- Comments title -->
    <div class="mb-4 flex items-center gap-2">
      <h4 class="text-[15px] font-bold text-slate-900">All Comments</h4>

      <span
        class="flex min-w-6 h-6 items-center justify-center rounded-full bg-blue-100 px-2 text-xs font-bold text-blue-600"
      >
        {{ commentList.length }}
      </span>
    </div>

    <!-- Single comment-->
    <div>
      @for (comment of commentList; track comment._id) {
        <div class="flex items-start gap-2.5 py-2">
          <img
            [src]="comment.commentCreator.photo"
            [alt]="comment.commentCreator.name"
            class="h-9 w-9 shrink-0 rounded-full object-cover"
          />

          <div class="min-w-0 flex-1">
            <!-- Comment content -->
            <div class="w-fit max-w-full rounded-2xl rounded-tl-md bg-slate-50 px-4 py-3">
              <div class="flex flex-wrap items-center gap-x-2 gap-y-0.5">
                <h5 class="text-sm font-bold text-slate-900">{{ comment.commentCreator.name }}</h5>

                <!-- <span class="text-xs text-slate-400"> @totti · 6s </span> -->
                <span class="text-xs text-slate-400"> @{{ comment.commentCreator.username }} </span>
              </div>

              <p class="mt-1 text-sm leading-5 text-slate-700 wrap-break-word">
                {{ comment.content }}
              </p>
            </div>

            <!-- Comment actions -->
            <div class="mt-1.5 flex items-center gap-4 ps-2 text-xs text-slate-500">
              <span>{{ comment.createdAt }}</span>

              <button type="button" class="cursor-pointer font-semibold hover:text-blue-600">
                Like ({{ comment.likes.length }})
              </button>

              <button type="button" class="cursor-pointer font-semibold hover:text-blue-600">
                Reply
              </button>
            </div>
          </div>
        </div>
      }
    </div>

    <!-- ================= CREATE COMMENT ================= -->
    <div class="mt-4 flex items-start gap-2.5">
      <!-- Current user photo -->
      <img
        src="/assets/images/default-profile.png"
        alt="Your profile"
        class="h-9 w-9 shrink-0 rounded-full object-cover"
      />

      <!-- Create comment box -->
      <div
        class="flex min-w-0 flex-1 items-center gap-2 rounded-2xl border border-transparent bg-slate-100 px-3 py-3 transition-all duration-200 focus-within:border-blue-400"
      >
        <div class="min-w-0 flex-1">
          <!-- Comment input -->
          <textarea
            rows="1"
            placeholder="Write a comment..."
            class="block h-9 w-full resize-none appearance-none border-0 bg-transparent px-1 py-2 text-sm text-slate-800 placeholder:text-slate-400 outline-none ring-0 focus:border-0 focus:outline-none focus:ring-0"
          ></textarea>

          <!-- Add image -->
          <input type="file" accept="image/*" [id]="'commentImage-'" class="hidden" />

          <label
            [for]="'commentImage-'"
            class="mt-1 flex w-fit cursor-pointer items-center gap-2 rounded-lg px-1 py-1 text-sm font-semibold text-slate-600 transition-colors hover:text-blue-600"
          >
            <i class="fa-regular fa-image text-base text-green-500"></i>

            <span>Photo/video</span>
          </label>
        </div>

        <!-- Send comment -->
        <button
          type="button"
          aria-label="Send comment"
          class="flex h-10 w-10 shrink-0 cursor-pointer items-center justify-center self-end rounded-full bg-blue-500 text-white shadow-sm transition-colors hover:bg-blue-600 focus:outline-none focus:ring-4 focus:ring-blue-200"
        >
          <i class="fa-regular fa-paper-plane text-sm"></i>
        </button>
      </div>
    </div>
  </div>
</section>
