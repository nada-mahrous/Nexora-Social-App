<section>
  <!-- ================= CREATE POST ================= -->
  <form
    class="w-full bg-white rounded-[16px] shadow-sm border border-slate-200 p-4 font-sans flex flex-col"
  >
    <!-- User Info -->
    <div class="flex items-center gap-3 mb-3">
      <img
        src="/assets/images/default-profile.png"
        alt="Profile"
        class="w-10 h-10 rounded-full object-cover shrink-0 bg-slate-100 border border-slate-50"
      />

      <div>
        <span class="text-[15px] font-bold text-slate-900 leading-tight"> Nada Mahrous </span>

        <!-- Privacy -->
        <div
          class="flex p-1 w-fit items-center gap-1 bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg shadow-xs"
        >
          <i class="fa-solid fa-earth-americas text-md"></i>
          <select class="border-none bg-transparent cursor-pointer outline-none py-1 pe-6 text-xs">
            <option>Public</option>
            <option>Followers</option>
            <option>Only me</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Post Content -->
    <div class="mb-4">
      <textarea
        class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3.5 text-[15px] text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-blue-50 focus:border-blue-300 transition-all resize-none min-h-30"
        placeholder="What's on your mind...?"
      ></textarea>
    </div>

    <hr class="border-t border-slate-200 mb-4" />

    <!-- Actions -->
    <div class="flex items-center justify-between">
      <!-- Photo -->
      <input type="file" id="file" class="hidden" />

      <label
        for="file"
        class="flex cursor-pointer items-center gap-2 text-slate-600 hover:bg-slate-50 px-2 py-1.5 rounded-lg transition-colors group"
      >
        <i
          class="fa-regular fa-image text-[#22c55e] text-[1.1rem] group-hover:scale-110 transition-transform"
        ></i>

        <span class="text-[14px] font-semibold text-slate-600"> Photo/video </span>
      </label>

      <!-- Post Button -->
      <button
        type="button"
        class="cursor-pointer bg-blue-500 hover:bg-blue-600 text-white px-5 py-2 rounded-lg font-bold text-[14px] flex items-center gap-2 focus:ring-4 focus:ring-blue-200 outline-none transition-colors"
      >
        Post

        <i class="fa-regular fa-paper-plane text-sm"></i>
      </button>
    </div>
  </form>

  <!-- ================= SAMPLE POST ================= -->
  <article class="mt-4 w-full bg-white rounded-[16px] shadow-sm border border-slate-200 p-4">
    <!-- Post Header -->
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img
          src="/assets/images/default-profile.png"
          alt="Profile"
          class="w-10 h-10 rounded-full object-cover"
        />

        <div>
          <!-- Name -->
          <h3 class="text-sm font-bold text-slate-900">Nada Mahrous</h3>

          <!-- Username + Time + Privacy -->
          <div class="flex items-center gap-1 text-xs text-slate-500 mt-0.5">
            <span>@nadaMahrous</span>

            <span>·</span>

            <span>2h</span>

            <span>·</span>

            <span class="flex items-center gap-1">
              Public

              <i class="fa-solid fa-earth-americas text-2xs"></i>
            </span>
          </div>
        </div>
      </div>

      <!-- More Menu -->
      <details class="relative">
        <!-- 3 Dots Button -->
        <summary
          class="list-none [&::-webkit-details-marker]:hidden w-9 h-9 flex items-center justify-center cursor-pointer rounded-full hover:bg-slate-100 text-slate-500 transition-colors"
        >
          <i class="fa-solid fa-ellipsis"></i>
        </summary>

        <!-- Dropdown Menu -->
        <div
          class="absolute right-0 top-11 z-50 w-48 rounded-xl border border-slate-200 bg-white p-2 shadow-xl"
        >
          <!-- Copy Link -->
          <button
            type="button"
            class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-700 hover:bg-slate-50 transition-colors cursor-pointer"
          >
            <i class="fa-regular fa-copy w-4 text-center"></i>
            <span>Copy link</span>
          </button>

          <!-- Save Post -->
          <button
            type="button"
            class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-700 hover:bg-slate-50 transition-colors cursor-pointer"
          >
            <i class="fa-regular fa-bookmark w-4 text-center"></i>
            <span>Save Post</span>
          </button>

          <!-- Edit Post -->
          <button
            type="button"
            class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-700 hover:bg-slate-50 transition-colors cursor-pointer"
          >
            <i class="fa-solid fa-pencil w-4 text-center"></i>
            <span>Edit post</span>
          </button>

          <!-- Delete Post -->
          <button
            type="button"
            class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-red-600 hover:bg-red-50 transition-colors cursor-pointer"
          >
            <i class="fa-regular fa-trash-can w-4 text-center"></i>
            <span>Delete post</span>
          </button>
        </div>
      </details>
    </div>

    <!-- ================= POST TEXT ================= -->
    <p class="mt-4 text-[15px] text-slate-800 leading-6">Building something new today ✨</p>

    <!-- ================= POST IMAGE ================= -->
    <div class="mt-4 overflow-hidden rounded-xl">
      <img src="/assets/images/post.png" alt="Post" class="w-full max-h-90 object-cover" />
    </div>

    <!-- ================= POST INFO ================= -->
    <div class="mt-4 flex items-center justify-between text-xs text-slate-500">
      <!-- Likes -->
      <div class="flex items-center gap-1.5">
        <span class="w-5 h-5 bg-blue-500 text-white rounded-full flex items-center justify-center">
          <i class="fa-solid fa-thumbs-up text-[9px]"></i>
        </span>

        <span>12 likes</span>
      </div>

      <!-- Comments + Shares -->
      <div class="flex items-center gap-4">
        <span class="cursor-pointer hover:underline"> 3 comments </span>

        <span class="cursor-pointer hover:underline"> 2 shares </span>
      </div>
    </div>

    <!-- ================= POST ACTIONS ================= -->
    <div class="mt-3 pt-3 border-t border-slate-200 grid grid-cols-3 gap-2">
      <!-- Like -->
      <button
        type="button"
        class="flex cursor-pointer items-center justify-center gap-2 py-2 rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-50 hover:text-blue-600 transition-colors"
      >
        <i class="fa-regular fa-thumbs-up"></i>

        Like
      </button>

      <!-- Comment -->
      <button
        type="button"
        class="flex cursor-pointer items-center justify-center gap-2 py-2 rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-50 hover:text-blue-600 transition-colors"
      >
        <i class="fa-regular fa-comment"></i>

        Comment
      </button>

      <!-- Share -->
      <button
        type="button"
        class="flex cursor-pointer items-center justify-center gap-2 py-2 rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-50 hover:text-blue-600 transition-colors"
      >
        <i class="fa-solid fa-share"></i>

        Share
      </button>
    </div>
  </article>
</section>
