<!-- Mobile / Tablet Toggle Button -->
<button
  type="button"
  class="inline-flex xl:hidden mb-4 w-full items-center justify-between rounded-2xl border border-slate-200 bg-white px-4 py-3 text-left shadow-sm"
>
  <span class="inline-flex items-center gap-2 text-sm font-extrabold text-slate-900">
    <i class="fa-solid fa-user-group text-blue-600 text-[1.1rem]"></i>
    Suggested Friends
  </span>

  <span class="inline-flex items-center gap-2">
    <span class="rounded-full bg-slate-100 px-2 py-0.5 text-xs font-bold text-slate-600"> 4 </span>

    <span class="text-xs font-bold text-[#1877f2]"> Show </span>
  </span>
</button>

<!-- Suggested Friends -->
<aside
  class="bg-white sticky top-21 xl:block rounded-3xl shadow-sm border border-slate-100 p-4 font-sans"
>
  <!-- Header -->
  <div class="flex items-center justify-between mb-4 px-1">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-user-group text-blue-600 text-[1.1rem]"></i>

      <h2 class="font-bold text-slate-900 text-[17px]">Suggested Friends</h2>
    </div>

    <span class="bg-slate-100 text-slate-600 text-xs font-bold px-2.5 py-1 rounded-full"> 4 </span>
  </div>

  <!-- Search -->
  <div class="relative mb-4">
    <i
      class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"
    ></i>

    <input
      type="text"
      placeholder="Search friends..."
      class="w-full rounded-xl border border-slate-200 bg-slate-50 py-2.5 pl-10 pr-4 text-sm text-slate-700 outline-none transition focus:border-blue-400 focus:bg-white focus:ring-4 focus:ring-blue-50"
    />
  </div>

  <!-- Friends List -->
  <div class="grid grid-cols-1 gap-3 pb-1">
    <!-- User 1 -->
    <div
      class="flex items-center justify-between gap-3 rounded-2xl p-2 hover:bg-slate-50 transition-colors"
    >
      <div class="flex items-center gap-3 min-w-0">
        <img
          src="/assets/images/default-profile.png"
          alt="Profile"
          class="w-11 h-11 rounded-full object-cover"
        />

        <div class="min-w-0">
          <h3 class="text-sm font-bold text-slate-900 truncate">Nada Mahrous</h3>

          <p class="text-xs text-slate-500 truncate">@nadaMahrous</p>
        </div>
      </div>

      <button
        type="button"
        class="shrink-0 cursor-pointer rounded-xl bg-blue-50 px-3 py-2 text-xs font-bold text-blue-600 hover:bg-blue-100 transition-colors"
      >
        Follow
      </button>
    </div>

    <!-- User 2 -->
    <div
      class="flex items-center justify-between gap-3 rounded-2xl p-2 hover:bg-slate-50 transition-colors"
    >
      <div class="flex items-center gap-3 min-w-0">
        <img
          src="/assets/images/default-profile.png"
          alt="Profile"
          class="w-11 h-11 rounded-full object-cover"
        />

        <div class="min-w-0">
          <h3 class="text-sm font-bold text-slate-900 truncate">Ahmed Ali</h3>

          <p class="text-xs text-slate-500 truncate">@ahmedAli</p>
        </div>
      </div>

      <button
        type="button"
        class="shrink-0 cursor-pointer rounded-xl bg-blue-50 px-3 py-2 text-xs font-bold text-blue-600 hover:bg-blue-100 transition-colors"
      >
        Follow
      </button>
    </div>

    <!-- User 3 -->
    <div
      class="flex items-center justify-between gap-3 rounded-2xl p-2 hover:bg-slate-50 transition-colors"
    >
      <div class="flex items-center gap-3 min-w-0">
        <img
          src="/assets/images/default-profile.png"
          alt="Profile"
          class="w-11 h-11 rounded-full object-cover"
        />

        <div class="min-w-0">
          <h3 class="text-sm font-bold text-slate-900 truncate">Sara Mohamed</h3>

          <p class="text-xs text-slate-500 truncate">@saraMohamed</p>
        </div>
      </div>

      <button
        type="button"
        class="shrink-0 cursor-pointer rounded-xl bg-blue-50 px-3 py-2 text-xs font-bold text-blue-600 hover:bg-blue-100 transition-colors"
      >
        Follow
      </button>
    </div>
  </div>

  <!-- View More -->
  <button
    type="button"
    class="w-full cursor-pointer mt-3 py-2.5 bg-white border border-slate-200 rounded-xl text-[14px] font-bold text-slate-700 hover:bg-slate-50 hover:border-slate-300 transition-all outline-none focus:ring-4 focus:ring-slate-100"
  >
    View more
  </button>
</aside>
