<div class="grid lg:grid-cols-2 h-dvh bg-white text-slate-900">
  <!-- Left Side -->
  <div class="hidden lg:flex relative h-dvh overflow-hidden bg-[#f8faff]">
    <!-- Soft Background -->
    <div class="absolute inset-0 z-0 bg-linear-to-br from-white via-[#fafbff] to-[#eef2ff]"></div>

    <!-- Social background -->
    <img
      src="/assets/images/signImage.png"
      alt="Nexora social community"
      class="absolute right-[-1%] top-0 z-1 h-full w-auto max-w-none object-contain object-right [-webkit-mask-image:linear-gradient(to_right,transparent_0%,black_18%,black_100%)] mask-[linear-gradient(to_right,transparent_0%,black_18%,black_100%)]"
    />

    <!-- White Fade Behind Text -->
    <div
      class="absolute inset-0 z-10 bg-linear-to-r from-white from-0% via-white/95 via-36% to-transparent to-58%"
    ></div>

    <!-- Very Soft Glow -->
    <div
      class="absolute -top-32 -left-32 z-10 w-96 h-96 rounded-full bg-mainColor/5 blur-3xl"
    ></div>

    <!-- Content -->
    <div class="relative z-20 w-full h-full flex flex-col justify-between px-14 xl:px-16 py-12">
      <!-- Logo -->
      <div class="flex items-center gap-3">
        <div
          class="w-11 h-11 rounded-lg bg-mainColor/8 border border-mainColor/10 flex items-center justify-center"
        >
          <i class="fa-brands fa-hive text-mainColor text-2xl"></i>
        </div>

        <h2 class="text-2xl font-bold tracking-tight text-slate-900">Nexora</h2>
      </div>

      <!-- Hero Content -->
      <div class="max-w-115">
        <!-- Heading -->
        <h1
          class="text-5xl xl:text-[3.5rem] font-extrabold text-slate-900 leading-[1.07] tracking-tight mb-6"
        >
          Connect with your
          <span class="text-mainColor whitespace-nowrap"> world. </span>
        </h1>

        <!-- Description -->
        <p class="max-w-88.75 text-slate-600 text-lg leading-7 mb-8">
          Share what matters, discover new perspectives, and stay close to the people and
          communities you care about.
        </p>

        <!-- Features -->
        <div class="flex items-center gap-4">
          <!-- Connect -->
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-mainColor/10 flex items-center justify-center">
              <i class="fa-solid fa-users text-mainColor text-xs"></i>
            </div>

            <span class="text-sm font-semibold text-slate-800"> Connect </span>
          </div>

          <!-- Separator -->
          <span class="rounded-full bg-slate-300"></span>

          <!-- Share -->
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-mainColor/10 flex items-center justify-center">
              <i class="fa-regular fa-paper-plane text-mainColor text-xs"></i>
            </div>

            <span class="text-sm font-semibold text-slate-800"> Share </span>
          </div>

          <!-- Separator -->
          <span class="rounded-full bg-slate-300"></span>

          <!-- Discover -->
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-mainColor/10 flex items-center justify-center">
              <i class="fa-regular fa-compass text-mainColor text-xs"></i>
            </div>

            <span class="text-sm font-semibold text-slate-800"> Discover </span>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="text-slate-400 text-xs tracking-wide">© 2026 Nexora</div>
    </div>
  </div>

  <!-- Right Side -->
  <div class="bg-white h-dvh">
    <router-outlet></router-outlet>
  </div>
</div>
