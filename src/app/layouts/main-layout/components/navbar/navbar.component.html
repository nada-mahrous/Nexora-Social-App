<nav
  class="fixed top-0 z-50 w-full h-18 px-7 flex items-center justify-between bg-white border-b border-slate-200 shadow-sm"
>
  <!-- David
    class="mx-auto flex max-w-7xl items-center justify-between gap-2 px-2 py-1.5 sm:gap-3 sm:px-3"
  -->

  <div class="flex items-center justify-between w-full h-full gap-2">
    <!-- ================= LOGO ================= -->
    <div class="flex items-center shrink-0">
      <div class="flex items-center gap-2 cursor-pointer">
        <div
          class="w-9 h-9 rounded-full bg-linear-to-br from-purple-500 to-blue-500 flex items-center justify-center shadow-md shadow-purple-500/20"
        >
          <span class="text-white font-bold text-base"> N </span>
        </div>

        <span class="text-slate-900 text-[22px] font-bold tracking-tight"> Nexora </span>
      </div>
    </div>

    <!-- ================= NAVIGATION ================= -->
    <div class="flex items-center gap-5 lg:gap-8 h-full">
      <!-- Feed -->
      <a
        routerLink="/feed"
        routerLinkActive="active-nav-link"
        class="relative h-full px-2 flex items-center gap-2 text-slate-500 hover:text-slate-900 transition-colors duration-200 font-semibold"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-5 h-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.8"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
          />
        </svg>
        <!-- Active Line -->
        <!-- <div
        class="absolute bottom-0 left-0 right-0 h-0.75 bg-linear-to-r from-purple-500 to-blue-500 rounded-full"
      ></div> -->
        <span class="hidden lg:inline">Feed</span>
      </a>

      <!-- Profile -->
      <a
        routerLink="/profile"
        routerLinkActive="active-nav-link"
        class="relative h-full px-2 flex items-center gap-2 text-slate-500 hover:text-slate-900 transition-colors duration-200 font-semibold"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-5 h-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.8"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
          />
        </svg>

        <span class="hidden lg:inline">Profile</span>
      </a>

      <!-- Notifications -->
      <a
        routerLink="/notifications"
        routerLinkActive="active-nav-link"
        class="relative h-full px-2 flex items-center gap-2 text-slate-500 hover:text-slate-900 transition-colors duration-200 font-semibold"
      >
        <div class="relative">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-5 h-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
              d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
            />
          </svg>
        </div>

        <span class="hidden lg:inline">Notifications</span>
      </a>
    </div>

    <!-- ================= SEARCH ================= -->
    <div class="relative hidden md:block w-full max-w-md">
      <span class="absolute inset-y-0 left-4 flex items-center text-slate-400">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-5 h-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          />
        </svg>
      </span>

      <input
        type="text"
        placeholder="Search Nexora"
        class="w-full bg-slate-100 border border-slate-200 rounded-full py-2.5 pl-12 pr-4 text-sm text-slate-700 placeholder:text-slate-400 outline-none focus:bg-white focus:border-purple-300 focus:ring-2 focus:ring-purple-100 transition-all duration-200"
      />
    </div>

    <!-- ================= PROFILE ================= -->
    <div class="relative shrink-0">
      <!-- <input type="checkbox" id="profile-menu" class="peer hidden" /> -->
      <input #profileMenu type="checkbox" id="profile-menu" class="peer hidden" />

      <!-- Click outside -->
      <label
        for="profile-menu"
        class="fixed inset-0 z-40 hidden peer-checked:block cursor-default"
      ></label>

      <!-- PROFILE PHOTO -->
      <label
        for="profile-menu"
        class="relative z-50 block cursor-pointer rounded-full p-0.5 bg-linear-to-br from-purple-500 via-pink-500 to-blue-500 hover:scale-105 active:scale-95 transition duration-200"
      >
        <!--  src="https://i.pravatar.cc/100?img=12" -->
        <img
          src="/assets/images/default-profile.png"
          alt="Profile"
          class="w-9 h-9 rounded-full object-cover border-2 border-white"
        />
      </label>

      <!-- ================= DROPDOWN ================= -->
      <div
        class="absolute right-0 top-13 z-50 w-64 bg-white border border-slate-200 rounded-2xl p-4 shadow-xl opacity-0 invisible pointer-events-none scale-95 -translate-y-2 peer-checked:opacity-100 peer-checked:visible peer-checked:pointer-events-auto peer-checked:scale-100 peer-checked:translate-y-0 transition-all duration-200 origin-top-right"
      >
        <!-- ================= USER INFO ================= -->
        <div class="flex items-center gap-3 pb-4 border-b border-slate-200">
          <div class="rounded-full p-0.5 bg-linear-to-br from-purple-500 via-pink-500 to-blue-500">
            <img
              src="/assets/images/default-profile.png"
              alt="Profile"
              class="w-11 h-11 rounded-full object-cover border-2 border-white"
            />
          </div>

          <div>
            <h4 class="text-slate-900 text-sm font-bold">Nada Mahrous</h4>

            <p class="text-slate-500 text-xs">@nadaMahrous</p>
          </div>
        </div>

        <!-- ================= MENU ================= -->
        <ul class="py-3 space-y-1">
          <!-- Profile -->
          <li>
            <a
              routerLink="/profile"
              (click)="profileMenu.checked = false"
              class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition text-sm font-medium"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-5 h-5 text-slate-500"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.8"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                />
              </svg>

              Profile
            </a>
          </li>

          <!-- Settings -->
          <li>
            <a
              routerLink="/changePassword"
              (click)="profileMenu.checked = false"
              class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition text-sm font-medium"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-5 h-5 text-slate-500"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.8"
                  d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37a1.724 1.724 0 002.572-1.065z"
                />

                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.8"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                />
              </svg>

              Settings
            </a>
          </li>
        </ul>

        <!-- ================= LOGOUT ================= -->
        <div class="pt-2 border-t border-slate-200">
          <a
            href="#"
            (click)="logOut()"
            (click)="profileMenu.checked = false"
            class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-rose-500 hover:bg-rose-50 transition text-sm font-semibold"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.8"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
              />
            </svg>

            Logout
          </a>
        </div>
      </div>
    </div>
  </div>
</nav>
